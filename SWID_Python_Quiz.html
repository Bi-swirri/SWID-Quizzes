<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SWID Quiz: Python Basics and Git</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3347;
    --orange: #f5783a;
    --orange-dim: #f5783a22;
    --blue: #4a9eff;
    --blue-dim: #4a9eff18;
    --green: #3dd68c;
    --green-dim: #3dd68c18;
    --red: #ff5c5c;
    --red-dim: #ff5c5c18;
    --text: #e8eaf0;
    --muted: #8b8fa8;
    --code-bg: #0a0c12;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .header {
    width: 100%;
    max-width: 720px;
    margin-bottom: 40px;
    text-align: center;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--orange);
    font-weight: 600;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  h1 span { color: var(--orange); }
  .subtitle { color: var(--muted); font-size: 14px; }

  .scoreboard {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .score-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 20px;
    text-align: center;
    min-width: 100px;
  }
  .score-box .val {
    font-size: 26px;
    font-weight: 700;
    color: var(--orange);
    line-height: 1;
  }
  .score-box .label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .streak-box .val { color: var(--green); }

  .progress-wrap {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--orange), var(--blue));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .card {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .q-num { font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .q-tag {
    font-size: 11px;
    background: var(--blue-dim);
    color: var(--blue);
    border: 1px solid var(--blue);
    border-radius: 99px;
    padding: 2px 10px;
    letter-spacing: 0.5px;
  }

  .question {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-family: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    font-size: 13px;
    color: #c8d0e8;
    line-height: 1.7;
    overflow-x: auto;
    white-space: pre;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-align: left;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--orange);
    background: var(--orange-dim);
    transform: translateX(3px);
  }
  .option-btn .opt-label {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .option-btn.correct { border-color: var(--green); background: var(--green-dim); }
  .option-btn.correct .opt-label { background: var(--green); color: #0f1117; }
  .option-btn.wrong { border-color: var(--red); background: var(--red-dim); }
  .option-btn.wrong .opt-label { background: var(--red); color: #fff; }
  .option-btn:disabled { cursor: default; }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: var(--green-dim); border: 1px solid var(--green); color: var(--green); }
  .feedback.wrong-fb { background: var(--red-dim); border: 1px solid var(--red); color: #ff8f8f; }

  .nav { width: 100%; max-width: 720px; display: flex; justify-content: flex-end; }
  .next-btn {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px 32px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: none;
    transition: opacity 0.2s, transform 0.15s;

  .next-btn:hover { opacity: 0.9; transform: scale(1.02); }

  .results {
    width: 100%; max-width: 720px;

    display: none;

  .results-emoji { font-size: 56px; margin-bottom: 12px; }
  .results h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
  .results .score-big { font-size: 52px; font-weight: 700; color: var(--orange); margin: 20px 0 4px; line-height: 1; }
  .results .score-label { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .results-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 28px; }
  .results-grid .score-box .val { font-size: 22px; }

  .topic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;

    margin-bottom: 24px;
    text-align: left;

  .topic-row:last-child { border-bottom: none; }
  .topic-row .t-score { font-weight: 700; }
  .t-full { color: var(--green); }
  .t-mid { color: var(--text); }

  .restart-btn {
    background: var(--surface);
    border: 1.5px solid var(--orange);
    color: var(--orange);
    border-radius: 10px;
    padding: 14px 32px;

    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;

  .streak-flash {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-60px);

    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 99px;

    z-index: 999;
    pointer-events: none;
  }

</style>
</head>

<script>
// ─── Question bank ───────────────────────────────────────────────────────────
// Each question has:
//   correctFeedback  shown when the student picks the right answer
//   wrongFeedback    shown when the student picks a wrong answer
// ─────────────────────────────────────────────────────────────────────────────
const ALL_QUESTIONS = [
  {

    options: [

      { text: "Pyth",  correct: false },

      { text: "ython", correct: false }
    ],
    correctFeedback: "Correct! -4 means 4th from the end. From there to the end gives t, h, o, n.",

const TOTAL = ALL_QUESTIONS.length;

// ─── Utility ─────────────────────────────────────────────────────────────────
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return s
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

// ─── State ────────────────────────────────────────────────────────────────────
let questions, current, score, streak, bestStreak, answered, topicStats;

// ─── Init ────────────────────────────────────────────────────────────────────
function init() {
  // Shuffle the question order, and shuffle the options inside each question.
  // Every option carries its own "correct" flag, so no index mapping is needed.
  questions = shuffleArray(ALL_QUESTIONS).map(q => ({ ...q, options: shuffleArray(q.options) }));

  current = 0; score = 0; streak = 0; bestStreak = 0; answered = false; topicStats = {};

  document.getElementById('scoreVal').textContent = 0;
  document.getElementById('streakVal').textContent = 0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('quizArea').style.display = '';
  document.querySelector('.progress-wrap').style.display = '';
  document.querySelector('.nav').style.display = '';

  renderQuestion();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = questions[current];
  const labels = ['A', 'B', 'C', 'D'];

  document.getElementById('qVal').textContent = (current + 1) + '/' + TOTAL;
  document.getElementById('progressBar').style.width = ((current / TOTAL) * 100) + '%';
  document.getElementById('nextBtn').classList.remove('show');
  document.getElementById('nextBtn').textContent = (current === TOTAL - 1) ? 'See Results →' : 'Next Question →';

  const codeHtml = q.code
    ? '<div class="code-block">' + esc(q.code) + '</div>'
    : '';

  const optionsHtml = q.options.map((opt, i) =>
    '<button class="option-btn" data-index="' + i + '" onclick="choose(' + i + ')">' +
      '<span class="opt-label">' + labels[i] + '</span>' +
      '<span>' + esc(opt.text) + '</span>' +
    '</button>'
  ).join('');

  document.getElementById('quizArea').innerHTML =
    '<div class="card">' +
      '<div class="q-meta">' +
        '<span class="q-num">Question ' + (current + 1) + ' of ' + TOTAL + '</span>' +
        '<span class="q-tag">' + esc(q.tag) + '</span>' +
      '</div>' +
      '<div class="question">' + esc(q.question) + '</div>' +
      codeHtml +
      '<div class="options">' + optionsHtml + '</div>' +
      '<div class="feedback" id="feedback"></div>' +
    '</div>';
}

// ─── Answer handler ───────────────────────────────────────────────────────────
function choose(clickedIndex) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const isCorrect = q.options[clickedIndex].correct;
  const btns = document.querySelectorAll('.option-btn');

  btns.forEach(b => { b.disabled = true; });
  btns[clickedIndex].classList.add(isCorrect ? 'correct' : 'wrong');

  // Always show the right answer, even if the student was wrong
  btns.forEach((b, i) => {
    if (q.options[i].correct) b.classList.add('correct');
  });

  // Track the score by topic
  if (!topicStats[q.tag]) topicStats[q.tag] = { right: 0, total: 0 };
  topicStats[q.tag].total++;

  if (isCorrect) {
    score++;
    streak++;
    topicStats[q.tag].right++;
    if (streak > bestStreak) bestStreak = streak;
    if (streak >= 3) showStreakFlash();
  } else {
    streak = 0;
  }

  document.getElementById('scoreVal').textContent = score;
  document.getElementById('streakVal').textContent = streak;

  const fb = document.getElementById('feedback');
  fb.textContent = (isCorrect ? '✅ ' : '❌ ') + (isCorrect ? q.correctFeedback : q.wrongFeedback);
  fb.className = 'feedback show ' + (isCorrect ? 'correct-fb' : 'wrong-fb');

  document.getElementById('progressBar').style.width = (((current + 1) / TOTAL) * 100) + '%';
  document.getElementById('nextBtn').classList.add('show');
}

// ─── Streak flash ─────────────────────────────────────────────────────────────
function showStreakFlash() {
  const el = document.getElementById('streakFlash');
  el.textContent = '🔥 ' + streak + ' in a row!';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ─── Next button ──────────────────────────────────────────────────────────────
document.getElementById('nextBtn').addEventListener('click', () => {
  current++;
  if (current >= TOTAL) {
    showResults();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
});

// ─── Results ──────────────────────────────────────────────────────────────────
function showResults() {
  document.getElementById('quizArea').style.display = 'none';
  document.querySelector('.nav').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';

  const pct = Math.round((score / TOTAL) * 100);
  let emoji = '💪', title = 'Keep practising!', label = 'Read the notebook again, run the code cells and try once more.';
  if (pct === 100) { emoji = '🏆'; title = 'Perfect Score!'; label = 'Outstanding! You got every question right.'; }
  else if (pct >= 80) { emoji = '🎉'; title = 'Great work!'; label = 'You have a solid grip on the Python basics.'; }
  else if (pct >= 60) { emoji = '👏'; title = 'Good effort!'; label = 'A little more practice and you will have this down.'; }

  document.getElementById('resultsEmoji').textContent = emoji;
  document.getElementById('resultsTitle').textContent = title;
  document.getElementById('resultsBig').textContent = score + '/' + TOTAL;
  document.getElementById('resultsLabel').textContent = label;
  document.getElementById('rCorrect').textContent = score;
  document.getElementById('rWrong').textContent = TOTAL - score;
  document.getElementById('rStreak').textContent = bestStreak;

  // Score by topic
  const rows = Object.keys(topicStats).map(tag => {
    const s = topicStats[tag];
    const cls = s.right === s.total ? 't-full' : (s.right / s.total < 0.5 ? 't-low' : 't-mid');
    return '<div class="topic-row"><span>' + esc(tag) + '</span>' +
           '<span class="t-score ' + cls + '">' + s.right + ' / ' + s.total + '</span></div>';
  }).join('');
  document.getElementById('topicRows').innerHTML = rows;

  document.getElementById('results').classList.add('show');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() { init(); }

init();
</script>
